# 쫑팔이삼촌 — PC 파이프라인
#
# 컨테이너:
#   postgrest       : 폰 ↔ PC REST 자동 입구
#   auth-service    : 로그인 / 재발급 / 로그아웃
#   upload-receiver : 통화 파일 받기
#   whisper-worker  : 음성 → 텍스트 (faster-whisper, large-v3)
#   fcm-pusher      : 새 요약 / 새 할 일 시 파이어베이스 푸시 (트리거만, 본문 X)
#   nginx           : 외부 입구 라우팅
#
# 디비: 별도 디비 서버 (weplay-db-server, PostgreSQL 17 + pgvector) 의 jjongpal_prd 데이터베이스 사용.
#       도커 컴포즈 안에 postgres 컨테이너 X.
#
# 에이전트 워커 (Claude Code 헤드리스 호출) 는 호스트 systemd. docker compose 밖.
#
# 외부 노출 포트 (포트 정책 슬롯 20025~20029 중 운영 백엔드 = 20026 만 호스트 바인딩):
#   - nginx 운영 백엔드: 호스트 127.0.0.1:20026 → 컨테이너 80
#   - 나머지 서비스는 도커 내부 네트워크에서만 통신, 호스트에 노출 X

services:
  postgrest:
    image: postgrest/postgrest:v12.2.0
    restart: unless-stopped
    environment:
      PGRST_DB_URI: ${DATABASE_URL}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: jjongpal_anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_PRE_REQUEST: public.set_app_context
      PGRST_OPENAPI_SERVER_PROXY_URI: ${PUBLIC_BASE_URL}

  auth-service:
    build: ./auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_TTL_SEC: ${ACCESS_TOKEN_TTL_SEC}
      REFRESH_TOKEN_TTL_SEC: ${REFRESH_TOKEN_TTL_SEC}

  upload-receiver:
    build: ./upload-receiver
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      STORAGE_ROOT: /storage
    volumes:
      - ${STORAGE_ROOT}:/storage

  whisper-worker:
    build: ./whisper-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      STORAGE_ROOT: /storage
      WHISPER_MODEL: ${WHISPER_MODEL}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE}
      WHISPER_DEVICE: ${WHISPER_DEVICE}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE}
    volumes:
      - ${STORAGE_ROOT}:/storage
      - ./whisper-worker/models:/models

  fcm-pusher:
    build: ./fcm-pusher
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CREDENTIALS: /secrets/service-account.json
    volumes:
      - ./fcm-pusher/service-account.json:/secrets/service-account.json:ro

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/static:/static:ro             # 정적 파일 (앱 빌드 등) 다운로드
    ports:
      - "127.0.0.1:20026:80"
    depends_on:
      - postgrest
      - auth-service
      - upload-receiver

# 외부 노출은 클라우드플레어 터널 (호스트 systemd) 이 127.0.0.1:20026 앞에 붙음.
