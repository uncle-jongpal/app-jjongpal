# 쫑팔이삼촌 — 엔진엑스 라우팅
# 클라우드플레어 터널이 127.0.0.1:8080 앞에 붙음.
# 외부 → /auth/ 인증 / /upload/ 파일 업로드 / /rest/ 자동 REST 입구 / /health 헬스체크

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 200M;     # 통화 파일 200MB 한도
    client_body_buffer_size 1m;

    # 보안 헤더
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # 헬스
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 정적 파일 배포 (앱 빌드 / 기타). /static/<filename> 으로 다운로드.
    # Content-Disposition 없음 — 브라우저가 패키지 설치기로 곧장 넘기게.
    location /static/ {
        alias /static/;
        autoindex off;
        types {
            application/vnd.android.package-archive apk;
        }
        default_type application/octet-stream;
    }

    # 인증
    location /auth/ {
        proxy_pass         http://auth-service:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # 업로드 (큰 multipart)
    location /upload/ {
        proxy_pass         http://upload-receiver:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_request_buffering off;        # 스트리밍 업로드
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 자동 REST 입구 (PostgREST)
    location /rest/ {
        proxy_pass         http://postgrest:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Accept-Encoding   "";
    }

    # 기타 — 404
    location / {
        return 404;
    }
}
