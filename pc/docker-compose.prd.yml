# 종팔(jjongpal) 운영 — 통합 백엔드 + 감시(watchdog). (같은 폴더 docker-compose.yml 은 옛 5-서비스 설계, 안 씀)
# 컨테이너 이름 표준 v1.1: 묶음 app-jjongpal-v1-prd / 컨테이너 app-jjongpal-v1-prd-api·-watchdog / 이미지 app-jjongpal-v1-api·-watchdog:<커밋>
# 배포: GIT_SHA=$(git rev-parse --short HEAD) docker compose -f docker-compose.prd.yml -p app-jjongpal-v1-prd up -d --build
# 비밀 env = .env.backend.prd / .env.watchdog.prd (0600, git 제외)
# 2026-09-30: docker run 으로 떠 있던 설정을 그대로 옮김(기본 bridge 네트워크·포트 127.0.0.1:20026 유지). 녹음 저장소는 /home/agent/work/prd/app-jjongpal/storage 로 통합
name: app-jjongpal-v1-prd
services:
  api:
    build: ./backend
    image: app-jjongpal-v1-api:${GIT_SHA:-a809f1d}
    container_name: app-jjongpal-v1-prd-api
    labels: { app.name: jjongpal, app.gen: v1, app.env: prd, app.role: api }
    network_mode: bridge
    ports:
      - "127.0.0.1:20026:8000"
    env_file: ./.env.backend.prd
    volumes:
      - /home/agent/work/prd/app-jjongpal/storage:/storage
      - /home/agent/work/prd/app-jjongpal/pc/nginx/static:/static:ro
      - /home/agent/work/prd/app-jjongpal/pc/fcm-pusher/service-account.json:/secrets/service-account.json:ro
    extra_hosts:
      - "db-device.taile93df1.ts.net:100.96.163.70"
    restart: unless-stopped
  watchdog:
    build: ./watchdog
    image: app-jjongpal-v1-watchdog:${GIT_SHA:-a809f1d}
    container_name: app-jjongpal-v1-prd-watchdog
    labels: { app.name: jjongpal, app.gen: v1, app.env: prd, app.role: watchdog }
    network_mode: bridge
    env_file: ./.env.watchdog.prd
    volumes:
      - /home/agent/work/prd/app-jjongpal/pc/fcm-pusher/service-account.json:/secrets/service-account.json:ro
      - /home/agent/work/prd/app-jjongpal/pc/watchdog-state:/data
    extra_hosts:
      - "db-device.taile93df1.ts.net:100.96.163.70"
    restart: unless-stopped
